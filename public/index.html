<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>To the Moon</title>
  <link rel="icon" href="icon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#103b9c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="To the Moon">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" width="26" height="26" alt="">
      <span>To the Moon</span>
    </div>
    <div class="topbar-right">
      <span class="pill" id="ccl-pill" title="Dólar contado con liquidación (venta)">CCL —</span>
      <span class="muted small" id="last-update"></span>
      <button class="btn ghost" id="btn-refresh" title="Actualizar cotizaciones">↻<span class="lbl-desk"> Actualizar</span></button>
      <button class="btn ghost icon" id="btn-hide" title="Ocultar / mostrar montos" aria-label="Ocultar montos" aria-pressed="false">👁</button>
      <button class="btn ghost icon" id="btn-theme" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
      <span class="pill user-pill" id="user-pill" hidden></span>
      <button class="btn ghost" id="btn-logout" title="Cerrar sesión">Salir</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="nav"></nav>
    <main id="view" class="view"></main>
  </div>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <dialog id="modal"></dialog>
  <div id="toast" class="toast" hidden></div>

  <!-- La app está dividida por sección; se cargan en este orden y comparten las variables globales -->
  <script src="js/base.js"></script>
  <script src="js/resumen.js"></script>
  <script src="js/cotizaciones.js"></script>
  <script src="js/carteras.js"></script>
  <script src="js/ajustes.js"></script>
  <script src="js/estrategias.js"></script>
  <script src="js/trading.js"></script>
  <script src="js/formularios.js"></script>
  <script src="js/eventos.js"></script>
</body>
</html>
